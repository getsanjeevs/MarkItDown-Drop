name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Test and build
        run: .\build.ps1
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory $t | Out-Null
          Copy-Item samples\sample.html $t
          $p = Start-Process dist\MarkItDownDrop.exe -ArgumentList "--selftest","`"$t\sample.html`"" -PassThru -Wait
          Get-Content "$t\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "Packaged exe failed its self-test" }
      - name: Compute checksum
        shell: pwsh
        run: (Get-FileHash dist\MarkItDownDrop.exe -Algorithm SHA256).Hash | Out-File dist\SHA256.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDownDrop
          path: dist/MarkItDownDrop.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MarkItDownDrop.exe
            dist/SHA256.txt
          generate_release_notes: true
